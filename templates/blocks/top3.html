<div class="block">
  <h3 style="margin:0 0 15px 0;">Топ-3 кешбэк</h3>
  <table style="margin-top:10px;">
    <tr>
      <th>Категория</th>
      <th style="width:110px;" class="num">Кешбэк</th>
    </tr>
    {% for item in top3_with %}
      <tr>
        <td>{{ item.category }}</td>
        <td class="cash">{{ item.cashback }}</td>
      </tr>
    {% endfor %}
  </table>
</div>
