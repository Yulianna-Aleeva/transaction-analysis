<h3 style="margin:0 0 10px 0;">Рабочие vs Выходные
  <button id="ww-btn" class="btn-hide" onclick="toggle('ww-w','ww-wo','ww-st','ww-btn','hww')">Скрыть переводы</button>
</h3>
<div id="ww-w">
  <table><tr><th>Тип дня</th><th>Сумма</th></tr>
  {% for r in ww_with %}<tr><td>{{ r['Тип дня'] }}</td><td class="sum">{{ r['Итого расходов'] }}</td></tr>{% endfor %}</table>
  <span id="ww-st" class="small sum"></span>
</div>
<div id="ww-wo" class="hidden">
  <table><tr><th>Тип дня</th><th>Сумма</th></tr>
  {% for r in ww_without %}<tr><td>{{ r['Тип дня'] }}</td><td class="sum">{{ r['Итого расходов'] }}</td></tr>{% endfor %}</table>
</div>
