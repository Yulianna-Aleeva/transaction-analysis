<div class="block">
  <h3>Переводы физлицам</h3>
  <form method="POST" style="display:flex;align-items:center;gap:5px;margin-top:8px;">
    <input type="hidden" name="custom_end" value="{{ custom_end }}">
    <button name="fl_all" value="on" class="btn">Весь список</button>
    <input type="text" name="fl_query" placeholder="Имя Ф.">
    <button class="btn">Искать</button>
    <button type="button" class="btn" style="background:#6c757d" onclick="clearBlock('f-block')">Очистить</button>
  </form>
  {% if f_res or f_empty %}
  <div id="f-block" class="search-output" style="margin-top:10px;">
    {% if f_empty %}<p>{{ f_empty }}</p>
    {% else %}
    <div class="summary"><span>Найдено: {{ f_cnt }}</span><span>Сумма: {{ f_sum }} ₽</span></div>
    <table><tr><th>Дата</th><th>Сумма</th><th>Описание</th></tr>
    {% for tx in f_res %}<tr><td>{{ tx.date_operation }}</td><td class="sum">{{ tx.amount_rub }}</td><td>{{ tx.description }}</td></tr>{% endfor %}</table>
    {% endif %}
    <div style="text-align:right;margin-top:8px;"><button class="btn" style="background:#6c757d" onclick="clearBlock('f-block')">Очистить</button></div>
  </div>
  {% endif %}
</div>
