[project]
name = "transaction-analysis"
version = "0.1.0"
description = "Приложение для анализа транзакций."
authors = [{name = "Yulianna_Aleeva", email = "89673838388@mail.ru"}]
license = "MIT"
requires-python = ">=3.10"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.34.2"
pandas = "^2.3.0"
openpyxl = "^3.1.5"
flask = "^3.0.0"
dotenv = "^0.9.9"
yfinance = "^1.5.1"

[tool.poetry.group.dev.dependencies]
black = "^24.0.0"
isort = "^5.13.0"
flake8 = "^7.0.0"
mypy = "^1.10.0"
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
pandas-stubs = "^2.3.2.2406"
pytest-typing = "^26.3.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
exclude = ".git/|.venv"
target-version = ["py310"]
line-length = 119

[tool.isort]
profile = "black"
float_to_top = true
combine_as_imports = true

[tool.flake8]
max-line-length = 119
exclude = [".git", ".venv", "__pycache__", "venv", "env", ".mypy_cache", ".pytest_cache"]

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = ["venv"]
enable_error_code = ["ignore-without-code"]
warn_unused_ignores = true
ignore_missing_imports = true
